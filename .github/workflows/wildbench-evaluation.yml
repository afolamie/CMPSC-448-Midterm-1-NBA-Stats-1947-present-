name: CMPSC 448 WildBench Evaluation
on:
  push:
    paths:
      - 'build_wildbench_data.py'
      - 'evaluate_models.py'
      - 'prepare_test_data.py'
      - 'requirements.txt'
      - '.github/workflows/wildbench-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download matched GPT Claude Gemini WildBench responses
        run: python build_wildbench_data.py --output generated/llm_responses.csv
      - name: Split by prompt
        run: python prepare_test_data.py --input generated/llm_responses.csv
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Train CNN and LSTM and evaluate
        run: python evaluate_models.py --data-dir generated/splits --output results --epochs 8
      - name: Upload dataset, splits and result metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cmpsc448-test-results
          if-no-files-found: warn
          path: |
            generated/llm_responses.csv
            generated/splits/
            results/
